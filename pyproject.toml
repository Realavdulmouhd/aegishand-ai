[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegishand-ai"
version = "0.1.0"
description = "Secure AI-powered hand gesture control system."
requires-python = ">=3.11"
dependencies = [
    "PyYAML",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]